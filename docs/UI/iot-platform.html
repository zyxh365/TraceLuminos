const MiniSpark = ({ data, color = '#4096ff', h = 32, w = 130 }) => {
  const max = Math.max(...data), min = Math.min(...data), r = max - min || 1;
  const pts = data.map((v, i) => [
    (i / (data.length - 1)) * w,
    h - ((v - min) / r) * (h - 4) - 2,
  ]);
  const d = pts.map(([x,y],i) => `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  return (
    <svg width={w} height={h} style={{ overflow:'visible', display:'block' }}>
      <defs>
        <linearGradient id={`sg${color.replace('#','')}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.25"/>
          <stop offset="100%" stopColor={color} stopOpacity="0.03"/>
        </linearGradient>
      </defs>
      <path d={d + ` L${w},${h} L0,${h} Z`} fill={`url(#sg${color.replace('#','')})`}/>
      <path d={d} fill="none" stroke={color} strokeWidth={1.5} strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
};

const GanttViz = ({ spans }) => {
  const total = 750;
  return (
    <svg width="100%" height={spans.length * 26 + 24} style={{ display:'block', minWidth: 400 }}>
      {[0,150,300,450,600,750].map(t => (
        <g key={t}>

          <text x={t/total*100+'%'} y={spans.length*26+18} fill="rgba(255,255,255,0.25)" fontSize={9} textAnchor="middle">{t}ms</text>
        </g>
      ))}
      {spans.map((s, i) => {
        const col = SVC_COLORS[s.svc] || '#4096ff';
        const x = s.ofs / total * 100;
        const wPct = Math.max(s.w / total * 100, 0.5);
        return (
          <g key={s.key}>
            <rect x={x+'%'} y={i*26+4} width={wPct+'%'} height={18} fill={col} opacity={s.ok?0.8:1} rx={3}/>
            {s.w > 60 && <text x={x+'%'} dominantBaseline="middle" dy={i*26+13+''} fill="white" fontSize={9} dx={4}>{s.dur}</text>}

        );

    </svg>
  );
};

      </div>
      {spark && <MiniSpark data={spark} color={color}/>}

);

// ─── App ──────────────────────────────────────────────────

const App = () => {
  const [page,     setPage]     = React.useState('dashboard');
  const [collapsed,setCollapsed]= React.useState(false);
  const [env,      setEnv]      = React.useState('prod');
  const [clock,    setClock]    = React.useState(new Date().toLocaleTimeString('zh-CN',{hour12:false}));
  React.useEffect(()=>{ const t=setInterval(()=>setClock(new Date().toLocaleTimeString('zh-CN',{hour12:false})),1000); return()=>clearInterval(t); },[]);

  const cur = NAV.find(n=>n.key===page) || NAV[0];
  const PageComp = cur.Comp;

  return (
    <ConfigProvider theme={{
      algorithm: theme.darkAlgorithm,
      token: { colorPrimary:'#4096ff', colorBgContainer:'#161b2e', colorBgElevated:'#1a2035',
               colorBgLayout:'#0a0e18', borderRadius:6, fontSize:13 },
      components: {
        Layout: { siderBg:'#0d1320', bodyBg:'#0a0e18', headerBg:'#0d1320' },

                <span style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>

            borderBottom:'1px solid rgba(255,255,255,0.06)',

          }}>

              {title:<span style={{color:'rgba(255,255,255,0.3)',fontSize:12}}>首页</span>},
              {title:<span style={{color:'rgba(255,255,255,0.85)',fontSize:12}}>{cur.label}</span>},
            ]}/>

          <Content style={{overflowY:'auto', background:'#0a0e18'}}>
            <PageComp key={page}/>

        </Layout>
      </Layout>
    </ConfigProvider>
